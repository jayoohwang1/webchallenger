
[tool.poetry]
name = "webchallenger"
version = "0.1.0"
description = "Divide and conquer Web Agent"
authors = ["anonymous"]
readme = "README.md"
packages = [{ include = "webchallenger" }]

[tool.poetry.dependencies]
python = "^3.10.1"
transformers = "4.47.0"
torch = ">=2.1.0"
pillow = ">=10.2.0"
loguru = ">=0.7.2,<0.8.0"
openai = ">=1.11.1"
playwright = "1.52.0"
aiolimiter = "^1.1.0"
beautifulsoup4 = "^4.12.3"
evaluate = "^0.4.1"
google-cloud-aiplatform = "^1.44.0"
gymnasium = "^0.29.1"
matplotlib = "^3.8.3"
nltk = "^3.8.1"
pytest-asyncio = "^0.23.6"
scikit-image = ">=0.25.0"
text-generation = "^0.7.0"
tiktoken = "^0.6.0"
survey = "^5.2.4"
beartype = "0.12.0"
markdownify = "^0.13.1"
browsergym = "^0.13.3"

[tool.poetry.group.dev.dependencies]
deptry = "^0.25.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
webchal = 'webchallenger.main:main'
